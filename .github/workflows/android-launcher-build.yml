name: Android Launcher Build

# 构建「安卓端启动器」——BlueRebirthApp（独立承载本地服务端，包名 com.blueoath.server）。
# 源码：src/BlueOath.Android/
#
# 版本号与 PC 启动器**同源**（src/BlueOath.Launcher.Wpf/version.txt）：
# 打 v* tag 时两端一起发同一个 Release，安卓端「检查更新」直接按 Release tag 比对版本。
# 配置库（config_*.db）不打进 APK：客户端/服务端/热更资源包三件套同装，
# 服务端启动时直接读热更资源包里的 config/。详见 android/tools/README.md。

on:
  push:
    branches:
      - master
      - WakabaMutsumi
    tags:
      - 'v*'
    paths:
      - 'src/BlueOath.Android/**'
      - 'src/BlueOath.Server/**'
      - 'src/BlueOath.Core/**'
      - 'src/BlueOath.Protocol/**'
      - 'src/BlueOath.Launcher.Wpf/version.txt'
      - 'Directory.Build.props'
      - 'android/tools/**'
      - '.github/workflows/android-launcher-build.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/BlueOath.Android/**'
      - 'src/BlueOath.Server/**'
      - 'src/BlueOath.Core/**'
      - 'src/BlueOath.Protocol/**'
      - 'Directory.Build.props'
      - 'android/tools/**'
      - '.github/workflows/android-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build BlueRebirthApp (Android)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号取 PC 启动器同一份 version.txt，保证两端一起发版。
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'src\BlueOath.Launcher.Wpf\version.txt' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid software version in version.txt: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "BlueRebirthApp version: $version"

      # 目标框架 net10.0-android，需要 .NET 10 SDK。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore
        run: dotnet restore src/BlueOath.Android/BlueOath.Android.csproj

      # MSBUILDDISABLENODEREUSE / UseSharedCompilation=false：
      # 避免编译服务进程占用输出 DLL（CS2012）与残留 MSBuild 节点。
      - name: Build (Release)
        shell: pwsh
        run: |
          $env:MSBUILDDISABLENODEREUSE = '1'
          dotnet build src/BlueOath.Android/BlueOath.Android.csproj `
            -c Release --no-restore -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 规范成 BlueRebirthApp-v<version>.apk —— Release 附件与 App 内自更新都按这个名字找。
      - name: Collect & rename APK
        id: apk
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP 'apk'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $src = Get-ChildItem -Path 'src/BlueOath.Android/bin/Release/net10.0-android' -Recurse -Filter '*.apk' |
                 Where-Object { $_.Name -like '*-Signed.apk' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $src) { throw 'No signed APK was produced.' }
          $name = "BlueRebirthApp-v${{ steps.ver.outputs.version }}.apk"
          Copy-Item $src.FullName (Join-Path $outDir $name)
          "{0}  {1:N1} MB" -f $name, ($src.Length / 1MB)
          "path=$(Join-Path $outDir $name)" >> $env:GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueRebirthApp-v${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  # 发版：master 推送 / v* tag / 手动触发时，把 APK 挂到与 PC 端**同一个**
  # GitHub Release 上（两端 version.txt 同源，共用同一个 v<version> tag）。
  # 与 PC workflow 的 publish job 条件保持一致；不使用 Gitee。
  publish:
    name: Publish BlueRebirthApp (Android)
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 PC 端同源判定 tag：打 v* tag 时校验与 version.txt 一致；
      # 否则用 v<version.txt> 作为 tag（若已存在，action-gh-release 会追加附件）。
      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'src/BlueOath.Launcher.Wpf/version.txt' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid software version in version.txt: $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagName = $env:GITHUB_REF_NAME
            $tagVersion = $tagName.Substring(1)
            if ($tagVersion -ne $version) {
              throw "Git tag version $tagVersion does not match software version $version."
            }
          } else {
            $tagName = "v$version"
          }
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tagName"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: BlueRebirthApp-v${{ steps.meta.outputs.version }}
          path: apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: BlueOath ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          files: apk/*.apk
          fail_on_unmatched_files: true
