name: Android Launcher Build

# 构建「安卓端启动器」——BlueRebirthApp（独立承载本地服务端，包名 com.blueoath.server）。
# 源码：src/BlueOath.Android/
#
# 配置库（config_*.db）**不打进 APK**：客户端/服务端/热更资源包三件套同装，
# 服务端启动时直接读热更资源包里的 config/。因此本工作流产出的 APK 是完整可用的
# （资源包由 android/tools/push-bundle.sh 单独部署）。
# 详见 android/tools/README.md 与 docs/ANDROID_RESTORATION_PLAN.zh-CN.md。

on:
  push:
    branches:
      - master
      - WakabaMutsumi
    paths:
      - 'src/BlueOath.Android/**'
      - 'src/BlueOath.Server/**'
      - 'src/BlueOath.Core/**'
      - 'src/BlueOath.Protocol/**'
      - 'src/BlueOath.Local.sln'
      - 'Directory.Build.props'
      - 'android/tools/**'
      - '.github/workflows/android-launcher-build.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/BlueOath.Android/**'
      - 'src/BlueOath.Server/**'
      - 'src/BlueOath.Core/**'
      - 'src/BlueOath.Protocol/**'
      - 'Directory.Build.props'
      - 'android/tools/**'
      - '.github/workflows/android-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build BlueRebirthApp (Android)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 目标框架 net10.0-android，需要 .NET 10 SDK。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore
        run: dotnet restore src/BlueOath.Android/BlueOath.Android.csproj

      # MSBUILDDISABLENODEREUSE / UseSharedCompilation=false：
      # 避免编译服务进程占用输出 DLL（CS2012）与残留 MSBuild 节点。
      - name: Build (Release)
        shell: pwsh
        run: |
          $env:MSBUILDDISABLENODEREUSE = '1'
          dotnet build src/BlueOath.Android/BlueOath.Android.csproj `
            -c Release --no-restore -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify APK produced
        shell: pwsh
        run: |
          $apks = Get-ChildItem -Path 'src/BlueOath.Android/bin/Release/net10.0-android' -Recurse -Filter '*.apk'
          $apks | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          if (-not $apks) { throw 'No APK was produced.' }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueRebirthApp-android-${{ github.run_number }}
          path: src/BlueOath.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
